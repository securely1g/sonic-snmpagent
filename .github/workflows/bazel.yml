name: Bazel snmpagent

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: SNMP source, wheel and AgentX (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    env:
      # setup-bazel configures one output base. Give the second workspace its
      # own server while preserving the shared action/repository caches.
      BAZEL_TEST_OUTPUT_BASE: /tmp/snmpagent-bazel-tests
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates curl git patch pkg-config python3 tar unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: snmpagent-amd64
          cache-version: "8.5.1"
      - name: Build owner wheel and run source/runtime tests
        env:
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(uname -m)" = x86_64
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = trixie
          bazel build //:sonic_snmpagent_wheel //:snmp_install
          bazel build //:sonic_snmpagent_wheel //:snmp_install
          (
            cd tests/bazel
            bazel --output_base="$BAZEL_TEST_OUTPUT_BASE" test //:unit_tests //:installed_wheel_test --local_test_jobs=1
          )
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
      - name: Retain wheel and test evidence
        if: always()
        env:
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tests/bazel/collect_evidence.py
      - name: Upload exact wheel and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-snmpagent-amd64
          path: bazel-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
